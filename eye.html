<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Gives the tilts real perspective (smaller number = stronger distortion) */
  .stage {
    width: 56vmin;
    height: 56vmin;
    perspective: 70vmin;
  }

  /* Moved to a new random tilt and size by the script below */
  .twitch {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 300ms cubic-bezier(.4, 0, .2, 1);
    will-change: transform;
  }

  /* Blink: the whole eye shrinks to nothing, then reopens */
  .layers {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    transition: transform 200ms ease-out, opacity 200ms ease-out;
    will-change: transform, opacity;
  }
  .layers.blink {
    transform: scale(0.02);
    opacity: 0;
    transition: transform 140ms ease-in, opacity 140ms ease-in;
  }

  img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Blurred copy behind the eye: its size and brightness are the glow */
  .glow {
    filter: blur(3.5vmin);
    opacity: 0.6;
    transition: opacity 300ms cubic-bezier(.4, 0, .2, 1), transform 300ms cubic-bezier(.4, 0, .2, 1);
    will-change: opacity, transform;
  }

  .sharp {
    filter: drop-shadow(0 0 1.2vmin rgba(63, 188, 239, 0.55));
  }
</style>
</head>

<script>
  // Settings: change these to make it calmer or wilder
  var TILT = 30;          // max tilt in degrees
  var SIZE_MIN = 0.86;    // smallest size
  var SIZE_MAX = 1.14;    // largest size
  var PAUSE_MIN = 1200;   // shortest wait between twitches (ms)
  var PAUSE_MAX = 4500;  // longest wait between twitches (ms)
  var BURST_CHANCE = 0.2;  // how often it fires several twitches in a row
  var MOVE_MIN = 220;     // fastest twitch movement (ms)
  var MOVE_MAX = 380;     // slowest twitch movement (ms)
  var BLINK_MIN = 5000;   // shortest wait between blinks (ms)
  var BLINK_MAX = 15000;  // longest wait between blinks (ms)
  var BLINK_SHUT = 110;   // how long it stays shut (ms)

  var twitch = document.querySelector('.twitch');
  var glow = document.querySelector('.glow');
  glow.src = document.querySelector('.sharp').src;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function pose() {
    var centre = Math.random() < 0.2;           // sometimes snap back to face forward
    var rx = centre ? 0 : rand(-TILT, TILT);
    var ry = centre ? 0 : rand(-TILT, TILT);
    var rz = centre ? 0 : rand(-4, 4);
    var size = rand(SIZE_MIN, SIZE_MAX);

    var snap = rand(MOVE_MIN, MOVE_MAX) + 'ms';
    twitch.style.transitionDuration = snap;
    glow.style.transitionDuration = snap;
    twitch.style.transform =
      'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) rotateZ(' + rz + 'deg) scale(' + size + ')';

    // Glow swells and brightens with the eye, with some randomness of its own
    var k = (size - SIZE_MIN) / (SIZE_MAX - SIZE_MIN);
    var g = Math.min(1, Math.max(0, k * 0.6 + Math.random() * 0.4));
    glow.style.opacity = 0.3 + 0.7 * g;
    glow.style.transform = 'scale(' + (0.95 + 0.45 * g) + ')';
  }

  function jolt() {
    // Size and glow jump on their own, keeping the current tilt
    var size = rand(SIZE_MIN, SIZE_MAX);
    var snap = rand(MOVE_MIN, MOVE_MAX) + 'ms';
    twitch.style.transitionDuration = snap;
    glow.style.transitionDuration = snap;
    twitch.style.transform = twitch.style.transform.replace(/scale\([^)]*\)/, 'scale(' + size + ')');
    var g = Math.random();
    glow.style.opacity = 0.3 + 0.7 * g;
    glow.style.transform = 'scale(' + (0.95 + 0.45 * g) + ')';
  }

  function loop() {
    if (twitch.style.transform && Math.random() < 0.35) { jolt(); } else { pose(); }
    var burst = Math.random() < BURST_CHANCE;
    setTimeout(loop, burst ? rand(MOVE_MAX, MOVE_MAX + 200) : rand(PAUSE_MIN, PAUSE_MAX));
  }
  loop();

  var layers = document.querySelector('.layers');
  function blink() {
    layers.classList.add('blink');
    setTimeout(function () { layers.classList.remove('blink'); }, 140 + BLINK_SHUT);
    setTimeout(blink, rand(BLINK_MIN, BLINK_MAX));
  }
  setTimeout(blink, rand(BLINK_MIN, BLINK_MAX));
</script>
